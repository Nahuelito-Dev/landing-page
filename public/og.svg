      d="M12 1.6c2.7 3 3.6 5.7 1.9 8.4 1.6-.4 2.8-1.5 3.4-3.1 1.7 2.3 2.2 5 .9 7.7-1.3 2.9-4.2 4.4-7.2 4.4-3.3 0-6.4-1.9-7-5.3-.5-2.8.9-5 2.8-6.6-.2 1.3.2 2.4 1.1 3.1-.9-3.2.5-6.4 4.1-8.6Z"
    />
    <text x="88" y="46" font-family="Geist, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-1">SPLG</text>
  </g>

  <text font-family="Geist, Helvetica, Arial, sans-serif" font-size="68" font-weight="600" fill="#FFFFFF" letter-spacing="-2.4">
