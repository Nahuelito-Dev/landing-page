      <stop offset="0" stop-color="#A85B00" stop-opacity="0.42" />
      <stop offset="1" stop-color="#A85B00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="boton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A85B00" />
      <stop offset="1" stop-color="#904D00" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#1C0A00" />
  <rect width="1200" height="630" fill="url(#brillo)" />

  <g transform="translate(96,96)">
